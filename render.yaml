services:
  - type: web
    name: corvis-trading
    runtime: node
    # Persistent disks require a paid Render instance type.
    plan: starter
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /health
    # Bot wallet keys are stored in DATA_DIR. Without a disk they are wiped on every deploy.
    disk:
      name: corvis-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATA_DIR
        value: /var/data
